<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
  <title>Academy Management | Prime Taekwondo</title><link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{--night:#0b1020;--navy:#14243d;--red:#ed3442;--gold:#efc45f;--ink:#172033;--muted:#6c7890;--line:#e1e7ef;--paper:#f4f6fa;--green:#14865c;--shadow:0 14px 40px #12203a12}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--night);color:white;padding:20px 14px}.brand{display:flex;align-items:center;gap:10px;margin:0 4px 24px;text-decoration:none;color:#fff;font-weight:900;font-size:15px}.brand img{width:48px;height:44px;object-fit:contain;mix-blend-mode:screen}.brand small{display:block;color:#b8c1ce;font-size:9px;letter-spacing:.13em}.nav-label{color:#78859a;font-size:10px;font-weight:900;letter-spacing:.15em;padding:0 11px;margin:18px 0 8px}.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:#d7deea;text-decoration:none;border:0;background:transparent;border-radius:9px;padding:10px 11px;margin:3px 0;font:inherit;cursor:pointer}.nav:hover,.nav.active{background:#ffffff14;color:#fff}.nav.active{box-shadow:inset 3px 0 var(--red)}.nav .ico{width:20px;text-align:center;color:var(--gold)}.side-foot{margin-top:22px;border-top:1px solid #ffffff1c;padding-top:12px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,44px);position:sticky;top:0;z-index:3}.top strong{font-size:15px}.top-actions{display:flex;gap:10px;align-items:center}.pill{font-size:11px;color:var(--green);background:#e9f7f0;padding:6px 10px;border-radius:99px;font-weight:800}.button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.content{width:min(1320px,94%);margin:28px auto 60px}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.heading h1{font-size:27px;letter-spacing:-.03em;margin:0}.heading p{color:var(--muted);margin:4px 0 0}.welcome{display:flex;align-items:center;gap:16px;padding:21px 23px;background:linear-gradient(115deg,#101a2b,#263d5e);border-radius:15px;color:white;margin-bottom:19px;box-shadow:var(--shadow)}.welcome-icon{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#ffffff17;font-size:26px}.welcome h2{margin:0;font-size:19px}.welcome p{margin:3px 0 0;color:#d0d8e3;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.stat,.card{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 24px #13233b08}.stat{padding:15px 17px}.stat-label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.08em}.stat-value{font-size:27px;font-weight:900;margin-top:5px}.stat-sub{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:19px}.card h3{margin:0;font-size:15px}.card p{color:var(--muted);font-size:13px}.section-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.section-tools .button{padding:9px 12px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}.data-table{width:100%;border-collapse:collapse;min-width:720px}.data-table th,.data-table td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.data-table th{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;background:#f8f9fb;white-space:nowrap}.data-table tr:last-child td{border-bottom:0}.data-table td{font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.small-btn{border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 9px;font-size:11px;font-weight:800;color:#344054}.small-btn.good{background:#eaf7f0;color:#15724e;border-color:#cdebdc}.small-btn.bad{background:#fff1f1;color:#b4232f;border-color:#f6d1d4}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0f3f7;color:#475467;font-size:10px;font-weight:800;text-transform:capitalize}.badge.pending{background:#fff3d8;color:#795600}.badge.approved,.badge.active,.badge.present{background:#eaf7f0;color:#15724e}.badge.rejected,.badge.inactive,.badge.absent{background:#fff0f0;color:#ac2630}.empty{padding:26px;text-align:center;color:var(--muted)}.notice{margin:12px 0;padding:11px 14px;border-radius:9px;background:#fff6df;color:#765b1e;font-size:12px}.alert{margin-bottom:15px;padding:11px 14px;border-radius:9px;background:#fff1ef;color:#9f2924;font-size:13px}.hidden{display:none!important}.site-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.site-link{display:block;color:inherit;text-decoration:none;background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.site-link:hover{border-color:#d7b958;box-shadow:var(--shadow)}.site-link b{display:block;margin:4px 0}.site-link span{color:var(--muted);font-size:12px}.modal-back{position:fixed;inset:0;background:#0b1020a8;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px;box-shadow:0 24px 80px #0005}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0}.modal-head button{border:0;background:transparent;font-size:24px;color:var(--muted)}.form{padding:18px 20px}.field{display:grid;gap:6px;margin:0 0 13px}.field label{font-size:11px;font-weight:800;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd5e2;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{margin:12px 0;padding:11px 13px;border-radius:8px;background:#fff2d6;color:#72541b;font-size:13px}.status.error{background:#fff0ef;color:#9b201b}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.side{height:auto;position:relative;padding:10px 12px;display:flex;align-items:center;gap:5px;overflow-x:auto}.brand{margin:0 8px 0 0;min-width:max-content}.brand img{width:38px;height:36px}.nav-label{display:none}.nav{width:auto;min-width:max-content;margin:0;padding:9px}.side-foot{display:contents}.top{height:58px}.content{margin-top:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:flex-start;flex-direction:column}}
    @media(max-width:540px){.grid,.site-links{grid-template-columns:1fr}.content{width:92%}.stats{gap:8px}.stat{padding:12px}.stat-value{font-size:23px}.welcome{padding:16px}.welcome-icon{width:44px;height:44px}.top .pill{display:none}.form-row{grid-template-columns:1fr;gap:0}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <a class="brand" href="index.html"><img src="logo.png" alt=""><span>PRIME <span style="color:#ff5964">TAEKWONDO</span><small>ACADEMY PORTAL</small></span></a>
    <div class="nav-label">ACADEMY</div><div id="navigation"></div>
    <div class="side-foot"><div class="nav-label">WEBSITE</div><a class="nav" href="site-manager.html#homepage"><span class="ico">🖥</span>Homepage editor</a><a class="nav" href="site-manager.html#gallery"><span class="ico">📷</span>Gallery manager</a><a class="nav" href="index.html" target="_blank" rel="noopener"><span class="ico">↗</span>Public website</a><button class="nav" id="signOut"><span class="ico">↪</span>Sign out</button></div>
  </aside>
  <div class="main"><header class="top"><strong>Prime Taekwondo · Admin</strong><div class="top-actions"><span class="pill">ADMIN ACCESS</span><button class="button secondary" id="refresh">↻ Refresh</button></div></header>
    <main class="content"><div class="heading"><div><h1 id="pageTitle">Academy overview</h1><p id="pageSubtitle">Student records, class activity and website tools in one place.</p></div></div>
      <div id="status" class="status" role="status">Checking Admin access…</div><div id="error" class="alert hidden"></div><div id="view"></div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const sections=[['Overview','⌂'],['Approvals','◷'],['Students','♙'],['Classes','▦'],['Attendance','✓'],['Student Progress','↗'],['Activities','✦'],['Family Updates','◉'],['Awards & Ranks','♜'],['Reports','▤']];
const cfg={
  Approvals:{table:'student_applications',order:'submitted_at',title:'Enrollment applications'},
  Students:{table:'academy_students',order:'created_at',title:'Student roster'},
  Classes:{table:'academy_classes',order:'class_date',title:'Class schedule'},
  Attendance:{table:'academy_attendance',order:'recorded_at',title:'Class attendance'},
  'Student Progress':{table:'academy_progress',order:'progress_date',title:'Student progress'},
  Activities:{table:'academy_activities',order:'activity_date',title:'Training activity log'},
  'Family Updates':{table:'academy_updates',order:'update_date',title:'Family updates'},
  'Awards & Ranks':{table:'academy_awards',order:'award_date',title:'Awards & recognition'}
};
let client,user,section='Overview',rows={},students=[],classes=[];
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10); const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
function status(text,bad=false){$('#status').textContent=text;$('#status').classList.toggle('error',bad);$('#status').classList.remove('hidden')}
function hideStatus(){$('#status').classList.add('hidden')}
function setNav(){ $('#navigation').innerHTML=sections.map(([name,ico])=>`<button class="nav ${section===name?'active':''}" data-section="${esc(name)}"><span class="ico">${ico}</span>${esc(name)}</button>`).join(''); document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;setNav();render()}); }
function studentName(id){return students.find(s=>s.id===id)?.full_name||'Student'}
function className(id){return classes.find(s=>s.id===id)?.title||'Class'}
function stat(label,value,sub,icon){return `<article class="stat"><div class="stat-label">${icon} &nbsp;${esc(label)}</div><div class="stat-value">${esc(value)}</div><div class="stat-sub">${esc(sub)}</div></article>`}
function table(heads,body){return `<div class="table-wrap"><table class="data-table"><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${heads.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function action(id,label,actionName,kind=''){return `<button class="small-btn ${kind}" data-action="${actionName}" data-id="${esc(id)}">${label}</button>`}
async function getRows(table,order){const {data,error}=await client.from(table).select('*').order(order,{ascending:false});if(error)throw error;return data||[]}
async function prepare(){[students,classes]=await Promise.all([getRows('academy_students','created_at'),getRows('academy_classes','class_date')]);}
async function render(){hideStatus();$('#error').classList.add('hidden');$('#pageTitle').textContent=section==='Overview'?'Academy overview':section;$('#pageSubtitle').textContent=section==='Overview'?'Students, training, approvals and website tools in one place.':(cfg[section]?.title||'Academy report');const v=$('#view');try{
 if(section==='Overview'){await prepare();const [apps,attendance,progress]=await Promise.all([getRows('student_applications','submitted_at'),getRows('academy_attendance','recorded_at'),getRows('academy_progress','progress_date')]);rows.Approvals=apps;rows.Attendance=attendance;rows['Student Progress']=progress;const pending=apps.filter(x=>x.status==='pending').length;v.innerHTML=`<section class="welcome"><div class="welcome-icon">🥋</div><div><h2>Welcome back, Admin</h2><p>Manage student journeys and keep the public academy site up to date.</p></div></section><div class="stats">${stat('ACTIVE STUDENTS',students.filter(s=>s.status==='active').length,'In the academy roster','♙')}${stat('PENDING APPROVALS',pending,'Applications waiting for review','◷')}${stat('CLASSES',classes.length,'Scheduled or recorded classes','▦')}${stat('PROGRESS NOTES',progress.length,'Coach updates recorded','↗')}</div><div class="grid"><section class="card"><div class="card-head"><h3>Approval queue</h3><button class="small-btn" data-goto="Approvals">Review applications →</button></div>${table(['Applicant','Student','Submitted','Status'],apps.filter(a=>a.status==='pending').slice(0,4).map(a=>`<tr><td>${esc(a.applicant_name)}</td><td>${esc(a.student_name)}</td><td>${date(a.submitted_at.slice(0,10))}</td><td><span class="badge pending">Pending</span></td></tr>`).join(''))}</section><section class="card"><div class="card-head"><h3>Latest class attendance</h3><button class="small-btn" data-goto="Attendance">Open attendance →</button></div>${table(['Student','Class','Date','Status'],attendance.slice(0,4).map(a=>`<tr><td>${esc(studentName(a.student_id))}</td><td>${esc(className(a.class_id))}</td><td>${date(a.recorded_at.slice(0,10))}</td><td><span class="badge ${esc(a.status)}">${esc(a.status)}</span></td></tr>`).join(''))}</section></div><section class="site-links"><a class="site-link" href="site-manager.html#homepage"><b>🖥 Homepage editor →</b><span>Update homepage text, coach details and contact information.</span></a><a class="site-link" href="site-manager.html#gallery"><b>📸 Gallery manager →</b><span>Add or remove public training and event photos.</span></a></section><div class="notice">Member progress is visible only to the student or parent email linked to that student profile. Admin is the only role that can change records.</div>`;
 }else if(section==='Reports'){await prepare();const [apps,att,prog,acts,awards]=await Promise.all([getRows('student_applications','submitted_at'),getRows('academy_attendance','recorded_at'),getRows('academy_progress','progress_date'),getRows('academy_activities','activity_date'),getRows('academy_awards','award_date')]);v.innerHTML=`<div class="stats">${stat('STUDENTS',students.filter(s=>s.status==='active').length,'Active profiles','♙')}${stat('APPLICATIONS',apps.filter(a=>a.status==='pending').length,'Pending review','◷')}${stat('ATTENDANCE RECORDS',att.length,'Saved class visits','✓')}${stat('PROGRESS & ACTIVITIES',prog.length+acts.length,'Coach entries','✦')}</div><section class="card"><div class="card-head"><h3>Student summary</h3></div>${table(['Student','Current rank','Classes attended','Progress notes','Awards'],students.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${esc(s.current_rank)}</td><td>${att.filter(a=>a.student_id===s.id&&a.status==='present').length}</td><td>${prog.filter(a=>a.student_id===s.id).length}</td><td>${awards.filter(a=>a.student_id===s.id).length}</td></tr>`).join(''))}</section>`;
 }else{await prepare();const c=cfg[section];let data=await getRows(c.table,c.order);rows[section]=data;if(section==='Awards & Ranks')rows.Ranks=await getRows('academy_rank_history','promotion_date');v.innerHTML=renderSection(section,data);wireActions();wireGoto();}
 wireGoto();
 }catch(e){$('#error').textContent=`Could not load this section: ${e.message||e}. Check that the new SQL setup has been run in Supabase.`;$('#error').classList.remove('hidden');v.innerHTML='';}}
function renderSection(name,data){const tools=(button,label)=>`<div class="section-tools"><button class="button" data-add="${button}">＋ ${label}</button></div>`;let heads=[],body='';
 if(name==='Approvals'){heads=['Applicant','Contact','Student / linked guardian','Message','Submitted','Status','Actions'];body=data.map(a=>`<tr><td><b>${esc(a.applicant_name)}</b><br>${esc(a.applicant_type)}</td><td>${esc(a.applicant_email)}<br>${esc(a.phone)}</td><td>${esc(a.student_name)}<br><small>${esc(a.student_email)} · guardian ${esc(a.parent_email||'—')}</small></td><td>${esc(a.message||'—')}</td><td>${date(a.submitted_at.slice(0,10))}</td><td><span class="badge ${esc(a.status)}">${esc(a.status)}</span></td><td><div class="actions">${a.status==='pending'?action(a.id,'Approve','approve','good')+action(a.id,'Reject','reject','bad'):''}${action(a.id,'Remove','delete','bad')}</div></td></tr>`).join('');return `${tools('application','Add request') }<section class="card"><div class="card-head"><h3>Applications and approvals</h3><span class="badge pending">${data.filter(a=>a.status==='pending').length} pending</span></div>${table(heads,body)}</section><div class="notice">Approving a request creates the student profile so the student/parent can view linked progress after they sign in. Supabase Auth accounts still need to be created in Authentication → Users.</div>`}
 if(name==='Students'){heads=['Student','Student email','Parent email','Rank','Status','Actions'];body=data.map(s=>`<tr><td><b>${esc(s.full_name)}</b><br><small>${date(s.created_at.slice(0,10))}</small></td><td>${esc(s.student_email||'—')}</td><td>${esc(s.parent_email||'—')}</td><td>${esc(s.current_rank)}</td><td><span class="badge ${esc(s.status)}">${esc(s.status)}</span></td><td><div class="actions">${action(s.id,'Edit','edit-student')}${action(s.id,s.status==='active'?'Set inactive':'Set active','toggle','')}${action(s.id,'Remove','delete','bad')}</div></td></tr>`).join('');return `${tools('student','Add student')}<section class="card"><div class="card-head"><h3>Student roster</h3><span class="badge">${data.length} profiles</span></div>${table(heads,body)}</section><div class="notice">Use the same email here that the student or parent will use to sign in. A parent email can be linked to multiple students.</div>`}
 if(name==='Classes'){heads=['Class','Date & time','Location','Details','Status','Actions'];body=data.map(c=>`<tr><td><b>${esc(c.title)}</b></td><td>${date(c.class_date)}<br>${esc(String(c.start_time).slice(0,5))}</td><td>${esc(c.location)}</td><td>${esc(c.details||'—')}</td><td><span class="badge ${c.is_published?'active':'inactive'}">${c.is_published?'Published':'Hidden'}</span></td><td><div class="actions">${action(c.id,c.is_published?'Hide':'Publish','class-toggle')}${action(c.id,'Remove','delete','bad')}</div></td></tr>`).join('');return `${tools('class','Add class')}<section class="card"><div class="card-head"><h3>Class schedule & class progress</h3></div>${table(heads,body)}</section>`}
 if(name==='Attendance'){heads=['Student','Class','Date','Status','Coach note','Actions'];body=data.map(a=>`<tr><td>${esc(studentName(a.student_id))}</td><td>${esc(className(a.class_id))}</td><td>${date(a.recorded_at.slice(0,10))}</td><td><span class="badge ${esc(a.status)}">${esc(a.status)}</span></td><td>${esc(a.note||'—')}</td><td>${action(a.id,'Remove','delete','bad')}</td></tr>`).join('');return `${tools('attendance','Record attendance')}<section class="card"><div class="card-head"><h3>Attendance log</h3></div>${table(heads,body)}</section>`}
 if(name==='Student Progress'){heads=['Student','Date','Skill','Score','Rank','Coach note','Next goal','Actions'];body=data.map(p=>`<tr><td>${esc(studentName(p.student_id))}</td><td>${date(p.progress_date)}</td><td>${esc(p.skill)}</td><td>${p.score==null?'—':esc(p.score)+'%'}</td><td>${esc(p.rank||'—')}</td><td>${esc(p.note||'—')}</td><td>${esc(p.next_goal||'—')}</td><td>${action(p.id,'Remove','delete','bad')}</td></tr>`).join('');return `${tools('progress','Add progress note')}<section class="card"><div class="card-head"><h3>Student progress & rank readiness</h3></div>${table(heads,body)}</section>`}
 if(name==='Activities'){heads=['Student','Activity','Date','Score','Training notes','Actions'];body=data.map(a=>`<tr><td>${esc(studentName(a.student_id))}</td><td><b>${esc(a.title)}</b></td><td>${date(a.activity_date)}</td><td>${a.score==null?'—':esc(a.score)+'%'}</td><td>${esc(a.details||'—')}</td><td>${action(a.id,'Remove','delete','bad')}</td></tr>`).join('');return `${tools('activity','Log activity')}<section class="card"><div class="card-head"><h3>Training activity</h3></div>${table(heads,body)}</section>`}
 if(name==='Family Updates'){heads=['For','Headline','Date','Message','Published','Actions'];body=data.map(a=>`<tr><td>${a.student_id?esc(studentName(a.student_id)):'All members'}</td><td><b>${esc(a.title)}</b></td><td>${date(a.update_date)}</td><td>${esc(a.message)}</td><td><span class="badge ${a.is_published?'active':'inactive'}">${a.is_published?'Yes':'No'}</span></td><td><div class="actions">${action(a.id,a.is_published?'Hide':'Publish','update-toggle')}${action(a.id,'Remove','delete','bad')}</div></td></tr>`).join('');return `${tools('update','Post family update')}<section class="card"><div class="card-head"><h3>Messages for students and families</h3></div>${table(heads,body)}</section>`}
 if(name==='Awards & Ranks'){let awards=data;let ranks=rows.Ranks||[];return `${tools('award','Add award')}<section class="card"><div class="card-head"><h3>Awards & recognition</h3></div>${table(['Student','Award','Date','Details','Actions'],awards.map(a=>`<tr><td>${esc(studentName(a.student_id))}</td><td><b>${esc(a.title)}</b></td><td>${date(a.award_date)}</td><td>${esc(a.description||'—')}</td><td>${action(a.id,'Remove','delete','bad')}</td></tr>`).join(''))}</section><div style="height:14px"></div><section class="card"><div class="card-head"><h3>Rank history</h3><button class="button secondary" data-add="rank">＋ Record promotion</button></div>${table(['Student','Rank achieved','Date','Coach note','Actions'],ranks.map(a=>`<tr><td>${esc(studentName(a.student_id))}</td><td><b>${esc(a.rank)}</b></td><td>${date(a.promotion_date)}</td><td>${esc(a.note||'—')}</td><td>${action(a.id,'Remove','rank-delete','bad')}</td></tr>`).join(''))}</section>`}
 return '<section class="card empty">No section is selected.</section>';
}
function field(label,name,type='text',required=true,placeholder='',options=null){if(options)return `<div class="field"><label>${esc(label)}</label><select name="${name}" ${required?'required':''}>${options.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${esc(label)}</label>${type==='textarea'?`<textarea name="${name}" placeholder="${esc(placeholder)}" ${required?'required':''}></textarea>`:`<input name="${name}" type="${type}" ${placeholder?`placeholder="${esc(placeholder)}"`:''} ${required?'required':''}>`}</div>`}
function studentOptions(){return students.map(s=>({value:s.id,label:s.full_name+(s.student_email?' · '+s.student_email:'')}))}
function openForm(kind,existing=null){if((!students.length&&['attendance','progress','activity','update','award','rank'].includes(kind))||(!classes.length&&kind==='attendance')){alert(kind==='attendance'?'Add at least one student and class first.':'Add a student profile first.');return}let title,fields='';const student=()=>field('Student','student_id','text',true,'',studentOptions()), rankOpts=['White Belt','Yellow Belt','Green Belt','Blue Belt','Red Belt','Black Belt'].map(x=>({value:x,label:x}));
 if(kind==='application'){title='Add an enrollment request';fields=field('Applicant name','applicant_name')+field('Applicant email','applicant_email','email')+field('Applicant type','applicant_type','text',true,'',[{value:'student',label:'Student'},{value:'parent',label:'Parent / Guardian'}])+field('Student name','student_name')+field('Student email','student_email','email')+field('Parent / guardian name','parent_name','text',false)+field('Parent / guardian email','parent_email','email',false)+field('Phone','phone','tel',false)+field('Message','message','textarea',false);}
 if(kind==='student'){title='Add a student profile';fields=field('Student name','full_name')+field('Student email used for sign-in','student_email','email',false)+field('Parent email used for sign-in','parent_email','email',false)+field('Current rank','current_rank','text',true,'',[{value:'White Belt',label:'White Belt'},{value:'Yellow Belt',label:'Yellow Belt'},{value:'Green Belt',label:'Green Belt'},{value:'Blue Belt',label:'Blue Belt'},{value:'Red Belt',label:'Red Belt'},{value:'Black Belt',label:'Black Belt'}]);}
 if(kind==='class'){title='Schedule a class';fields=field('Class name','title')+`<div class="form-row">${field('Date','class_date','date')}${field('Start time','start_time','time')}</div>`+field('Location','location','text',true,'Main Dojang')+field('Class details','details','textarea',false);}
 if(kind==='attendance'){title='Record class attendance';fields=student()+field('Class','class_id','text',true,'',classes.map(c=>({value:c.id,label:c.title+' · '+date(c.class_date)})))+field('Attendance status','status','text',true,'',[{value:'present',label:'Present'},{value:'absent',label:'Absent'},{value:'late',label:'Late'},{value:'excused',label:'Excused'}])+field('Coach note','note','textarea',false);}
 if(kind==='progress'){title='Add a student progress note';fields=student()+field('Progress date','progress_date','date')+field('Skill or milestone','skill')+field('Score / readiness (%)','score','number',false)+field('Current rank','rank','text',false)+field('Coach notes','note','textarea',false)+field('Next goal','next_goal','textarea',false);}
 if(kind==='activity'){title='Log a training activity';fields=student()+field('Activity or skill','title')+field('Date','activity_date','date')+field('Score (%)','score','number',false)+field('Training notes','details','textarea',false);}
 if(kind==='update'){title='Post a family update';fields=field('Share with','student_id','text',false,'',[{value:'',label:'All members'}].concat(studentOptions()))+field('Headline','title')+field('Date','update_date','date')+field('Message','message','textarea');}
 if(kind==='award'){title='Add a student award';fields=student()+field('Award name','title')+field('Date','award_date','date')+field('Details','description','textarea',false);}
 if(kind==='rank'){title='Record a rank promotion';fields=student()+field('New rank','rank','text',true,'',rankOpts)+field('Promotion date','promotion_date','date')+field('Coach note','note','textarea',false);}
 $('#view').insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><section class="modal"><header class="modal-head"><h2>${esc(title)}</h2><button type="button" id="closeModal" aria-label="Close">×</button></header><form class="form" id="modalForm">${fields}<div class="modal-actions"><button type="button" class="button secondary" id="cancelModal">Cancel</button><button class="button">Save</button></div></form></section></div>`);
 const close=()=>$('#modal')?.remove();$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#modalForm').querySelectorAll('input[type=date]').forEach(x=>x.value=today());$('#modalForm').querySelectorAll('input[type=time]').forEach(x=>x.value='17:30');$('#modalForm').querySelectorAll('input[name=location]').forEach(x=>x.value='Main Dojang');if(existing)for(const [key,value] of Object.entries(existing)){const input=$('#modalForm').elements.namedItem(key);if(input&&value!=null)input.value=value}
 $('#modalForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),row=Object.fromEntries(fd);for(const k of ['score'])if(row[k]==='')row[k]=null;if(row.student_id==='')row.student_id=null;if(kind==='student'||kind==='class'||kind==='update'||kind==='award'||kind==='rank')row.created_by=user.id;if(kind==='attendance'||kind==='progress'||kind==='activity')row.recorded_by=user.id;try{let tableName,insert=row;if(kind==='application')tableName='student_applications';if(kind==='student')tableName='academy_students';if(kind==='class')tableName='academy_classes';if(kind==='attendance')tableName='academy_attendance';if(kind==='progress')tableName='academy_progress';if(kind==='activity')tableName='academy_activities';if(kind==='update')tableName='academy_updates';if(kind==='award')tableName='academy_awards';if(kind==='rank')tableName='academy_rank_history';if(kind==='rank'){tableName='academy_rank_history';const studentRecord=students.find(s=>s.id===row.student_id);if(studentRecord)await client.from('academy_students').update({current_rank:row.rank}).eq('id',row.student_id)}const result=existing?await client.from(tableName).update(insert).eq('id',existing.id):await client.from(tableName).insert(insert);if(result.error)throw result.error;close();await render()}catch(err){$('#error').textContent=`Save failed: ${err.message||err}`;$('#error').classList.remove('hidden')}};
}
async function approveApplication(id){const app=(rows.Approvals||[]).find(a=>a.id===id);if(!app)return;let check=client.from('academy_students').select('id');check=app.student_email?check.ilike('student_email',app.student_email):check.ilike('full_name',app.student_name).ilike('parent_email',app.parent_email||app.applicant_email);const {data:existing,error:checkError}=await check.limit(1);if(checkError)throw checkError;if(!existing?.length){const parentEmail=app.parent_email||(app.applicant_type==='parent'?app.applicant_email:'');const {error}=await client.from('academy_students').insert({full_name:app.student_name,student_email:app.student_email||'',parent_email:parentEmail,current_rank:'White Belt',status:'active',created_by:user.id});if(error)throw error}const {error}=await client.from('student_applications').update({status:'approved',reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);if(error)throw error}
async function onAction(button){const {action:act,id}=button.dataset;try{if(act==='edit-student'){openForm('student',students.find(s=>s.id===id));return}if(act==='approve'){if(!confirm('Approve this request and add the student to the roster?'))return;await approveApplication(id)}else if(act==='reject'){const {error}=await client.from('student_applications').update({status:'rejected',reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);if(error)throw error}else if(act==='toggle'){const s=students.find(x=>x.id===id);const {error}=await client.from('academy_students').update({status:s.status==='active'?'inactive':'active'}).eq('id',id);if(error)throw error}else if(act==='class-toggle'){const c=classes.find(x=>x.id===id);const {error}=await client.from('academy_classes').update({is_published:!c.is_published}).eq('id',id);if(error)throw error}else if(act==='update-toggle'){const r=(rows['Family Updates']||[]).find(x=>x.id===id);const {error}=await client.from('academy_updates').update({is_published:!r.is_published}).eq('id',id);if(error)throw error}else{let t=section==='Approvals'?'student_applications':section==='Students'?'academy_students':section==='Classes'?'academy_classes':section==='Attendance'?'academy_attendance':section==='Student Progress'?'academy_progress':section==='Activities'?'academy_activities':section==='Family Updates'?'academy_updates':section==='Awards & Ranks'?(act==='rank-delete'?'academy_rank_history':'academy_awards'):'';if(!t)throw Error('Unknown record type.');if(!confirm('Remove this record?'))return;const {error}=await client.from(t).delete().eq('id',id);if(error)throw error}await render()}catch(e){$('#error').textContent=`Action failed: ${e.message||e}`;$('#error').classList.remove('hidden')}}
function wireActions(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>onAction(b))}
function wireGoto(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{section=b.dataset.goto;setNav();render()})}
async function protect(){try{client=window.createPrimeSupabaseClient?.();if(!client){status('Supabase setup is not finished. Open the setup guide.',true);return}const {data:{session}}=await client.auth.getSession();if(!session){location.replace('admin-login.html');return}const {data:admin,error}=await client.rpc('is_site_admin');if(error||admin!==true){await client.auth.signOut();location.replace('admin-login.html');return}const {data:{user:current}}=await client.auth.getUser();user=current;hideStatus();setNav();await render()}catch(e){status(`Could not verify Admin access: ${e.message||e}`,true)}}
$('#signOut').onclick=async()=>{if(client)await client.auth.signOut();location.href='admin-login.html'};$('#refresh').onclick=()=>render();protect();
</script>
</body>
