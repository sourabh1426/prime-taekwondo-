<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Member Portal | Prime Taekwondo</title><link rel="icon" type="image/png" href="logo.png">
<style>
:root{--night:#0b1020;--navy:#192c49;--red:#ed3442;--gold:#efc45f;--ink:#172033;--muted:#6d7890;--line:#e1e7ef;--paper:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#253956 0,#101a2b 45%,#0b1020 100%);color:var(--ink);font:15px/1.5 Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:25px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;background:#ffffff10;border:1px solid #ffffff1c;border-radius:13px;color:white}.brand{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-weight:900;letter-spacing:.03em}.brand img{width:44px;height:42px;object-fit:contain;mix-blend-mode:screen}.brand small{display:block;color:#c8d0dc;font-size:9px;letter-spacing:.15em}.top-actions{display:flex;gap:9px;align-items:center}.button{border:0;border-radius:8px;padding:11px 15px;background:var(--red);color:white;font-weight:800}.button.light{background:white;color:var(--ink)}.button.outline{background:transparent;border:1px solid #ffffff70;color:white}.button:disabled{opacity:.6;cursor:wait}.text-link{display:block;margin:12px auto 0;padding:4px 8px;border:0;background:none;color:#435c80;text-decoration:underline;font-size:13px}.shell{max-width:590px;margin:32px auto 0}.panel{background:#fff;border:1px solid #e8edf4;border-radius:16px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 70px #0003}.panel h1{font-size:26px;line-height:1.2;margin:0 0 7px}.muted{color:var(--muted);line-height:1.55}.tabs{display:flex;gap:8px;margin:20px 0 15px;background:#f1f3f7;padding:5px;border-radius:10px}.tabs button{border:0;border-radius:7px;background:transparent;padding:10px;flex:1;color:#536079;font-weight:800}.tabs button.active{background:white;color:var(--ink);box-shadow:0 2px 8px #13233b12}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{padding:12px;border:1px solid #cbd4e0;border-radius:8px;width:100%;background:white;color:var(--ink)}.field textarea{min-height:74px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{width:100%;margin-top:7px}.error{color:#b4232f;background:#fff1f1;padding:10px 12px;border-radius:8px;font-size:13px;margin:12px 0}.success{color:#176848;background:#eaf7f0;padding:12px 14px;border-radius:9px;font-size:13px;margin:12px 0}.notice{padding:13px 14px;border-radius:9px;background:#fff7e3;color:#75591d;font-size:12px;margin:15px 0;line-height:1.6}.back{display:block;text-align:center;color:#c7d2e2;margin:18px auto 0;font-size:13px}.dash{max-width:980px;margin:24px auto 0}.dash-head{color:white;margin:24px 2px 16px}.dash-head h1{font-size:26px;margin:0 0 4px}.dash-head p{color:#ccd6e4;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.card h2{font-size:14px;margin:0 0 13px}.profile{grid-column:1/-1;display:flex;gap:14px;align-items:center;background:linear-gradient(115deg,#13213a,#263e61);color:white;border:0}.belt{width:49px;height:49px;border-radius:14px;background:#ffffff1d;display:grid;place-items:center;font-size:24px}.photo-frame{position:relative;overflow:hidden;flex:0 0 62px;width:62px;height:62px;border-radius:18px;background:#ffffff1d}.photo-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo-fallback{font-size:27px}.profile small{color:#ccd6e4;font-size:10px;letter-spacing:.1em}.profile h2{font-size:20px;margin:2px 0}.stat{font-size:27px;font-weight:900}.label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.08em}.row{padding:10px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.5}.row:first-of-type{border-top:0}.row small{display:block;color:var(--muted);margin-top:4px}.progress{height:8px;background:#eef1f5;border-radius:9px;overflow:hidden;margin:9px 0}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:9px}.empty{padding:14px 4px;color:var(--muted);font-size:12px}.full{grid-column:1/-1}.badge{display:inline-block;padding:4px 8px;border-radius:30px;background:#fff3d8;color:#755800;font-size:10px;font-weight:800;text-transform:capitalize}.badge.approved{background:#eaf7f0;color:#15724e}.foot{text-align:center;color:#c7d2e2;font-size:12px;margin-top:17px}.hidden{display:none!important}
@media(max-width:680px){.wrap{padding:12px 11px 38px}.top{padding:10px}.brand img{width:36px}.top-actions .button{padding:9px 10px;font-size:12px}.dash{margin-top:12px}.grid{grid-template-columns:1fr}.profile,.full{grid-column:auto}.form-row{grid-template-columns:1fr;gap:0}}
</style></head>
<body><div class="wrap"><header class="top"><a class="brand" href="index.html"><img src="logo.png" alt=""><span>PRIME TAEKWONDO<small>STUDENT & PARENT PORTAL</small></span></a><div class="top-actions"><button id="signOut" class="button light hidden">Sign out</button><a href="index.html" class="button outline">Website</a></div></header><main id="app"></main><div class="foot">Train with purpose · Prime Taekwondo</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const app=document.querySelector('#app');let db;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(v){if(!v)return '—';return new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function showError(message){const box=$('#formMessage');if(box){box.className='error';box.textContent=message;box.classList.remove('hidden')}}
function showSuccess(message){const box=$('#formMessage');if(box){box.className='success';box.textContent=message;box.classList.remove('hidden')}}
function requestErrorMessage(err){const raw=String(err?.message||'Request could not be sent.'),message=raw.toLowerCase();if(message.includes('email rate limit')||message.includes('over_email_send_rate_limit'))return 'Supabase ka email quota bhar gaya hai. Baar-baar request na bhejein. Admin ko Authentication → Emails → SMTP Settings mein custom email service set up karni hogi; phir request ek baar submit karein.';if(message.includes('email address not authorized')||message.includes('email_address_not_authorized'))return 'Supabase ka default email sirf project team ke addresses ko bhej sakta hai. Bahar ke student emails ke liye Admin ko Authentication → Emails → SMTP Settings mein custom email service set up karni hogi.';if(message.includes('already registered')||message.includes('user already registered'))return 'Is email ka account pehle se hai. Sign in karein; password bhool gaye ho toh Forgot password use karein.';return raw}
function accessForm(authenticated=false,email=''){return `<form id="requestForm">${authenticated?'':`<div class="field"><label>Your name</label><input name="applicant_name" required minlength="2" maxlength="120"></div><div class="field"><label>Email for your login</label><input name="applicant_email" type="email" required autocomplete="email"></div><div class="field"><label>Create password</label><input name="password" type="password" required minlength="8" autocomplete="new-password"><small class="muted">At least 8 characters.</small></div>`}<div class="field"><label>Requesting as</label><select name="applicant_type" id="applicantType"><option value="student">Student</option><option value="parent">Parent / Guardian</option></select></div>${authenticated?`<div class="field"><label>Your name</label><input name="applicant_name" required minlength="2" maxlength="120"></div>`:''}<div class="field"><label>Student name</label><input name="student_name" required minlength="2" maxlength="120"></div><div class="field"><label>Student email (if they have their own login)</label><input name="student_email" type="email" placeholder="Optional for younger students"></div><div class="form-row"><div class="field"><label>Parent / guardian name</label><input name="parent_name"></div><div class="field"><label>Parent / guardian email</label><input name="parent_email" type="email" value="${authenticated?esc(email):''}"></div></div><div class="field"><label>Phone</label><input name="phone" type="tel" maxlength="30"></div><div class="field"><label>Message (optional)</label><textarea name="message" maxlength="1000" placeholder="Anything the coach should know?"></textarea></div><div id="formMessage" class="hidden"></div><button class="button wide" type="submit">Request portal access</button></form>`}
function authMessage(err){const message=String(err?.message||'Could not sign in.');if(message==='Invalid login credentials')return 'Email ya password match nahi hua, ya is email ka login account abhi bana nahi hai. Account nahi banaya? Request access karein; account hai? Forgot password se password badlein.';if(message.toLowerCase().includes('email not confirmed'))return 'Pehle apne inbox mein Supabase ka confirmation email kholkar email confirm karein.';return message}
function recoveryPage(){if($('#passwordRecoveryForm'))return;app.innerHTML=`<section class="shell"><div class="panel"><h1>Set a new password</h1><p class="muted">Choose a new password for your Member Portal account.</p><form id="passwordRecoveryForm"><div class="field"><label>New password</label><input name="password" type="password" required minlength="8" autocomplete="new-password"><small class="muted">At least 8 characters.</small></div><div class="field"><label>Confirm new password</label><input name="confirm" type="password" required minlength="8" autocomplete="new-password"></div><div id="formMessage" class="hidden"></div><button class="button wide" type="submit">Save new password</button></form><a class="back" href="index.html">← Back to public website</a></div></section>`;$('#passwordRecoveryForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),fd=new FormData(form),password=String(fd.get('password'));if(password!==fd.get('confirm')){showError('Dono passwords match nahi karte.');return}button.disabled=true;try{const {error}=await db.auth.updateUser({password});if(error)throw error;await db.auth.signOut();history.replaceState(null,'',location.pathname+location.search);app.innerHTML=`<section class="shell"><div class="panel"><h1>Password updated</h1><div class="success">Aapka password change ho gaya. Ab naye password se sign in karein.</div><button class="button wide" id="returnToLogin">Go to sign in</button></div></section>`;$('#returnToLogin').onclick=()=>entry('login')}catch(err){showError(err.message||'Password update nahi ho saka. Reset link expire ho sakta hai; naya link mangayein.')}finally{if(button.isConnected)button.disabled=false}})}
async function sendPasswordReset(email,button){if(!email){showError('Pehle apna email address likhein, phir Forgot password par click karein.');$('#loginForm [name=email]')?.focus();return}button.disabled=true;try{const redirectTo=location.origin+location.pathname;const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;showSuccess('Agar is email par account hai, password reset link inbox mein bhej diya gaya hai. Spam folder bhi check karein.')}catch(err){showError(err.message||'Reset email nahi bheja ja saka.')}finally{button.disabled=false}}
function entry(mode='login'){app.innerHTML=`<section class="shell"><div class="panel"><h1>Member Portal</h1><p class="muted">Sign in to view student progress, or request an account. New accounts need Admin approval before training records are available.</p><div class="tabs"><button class="${mode==='login'?'active':''}" data-mode="login">Sign in</button><button class="${mode==='request'?'active':''}" data-mode="request">Request access</button></div>${mode==='login'?`<form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><div id="formMessage" class="hidden"></div><button class="button wide">Sign in</button><button class="text-link" id="forgotPassword" type="button">Forgot password?</button></form>`:accessForm(false)}<div class="notice"><b>Approval gate:</b> you can submit a request at any time. Admin reviews it first; student and family progress stays hidden until the profile is approved.</div><a class="back" href="index.html">← Back to public website</a></div></section>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>entry(b.dataset.mode));$('#loginForm')?.addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button[type=submit]');button.disabled=true;try{const fd=new FormData(e.currentTarget);const {error}=await db.auth.signInWithPassword({email:String(fd.get('email')).trim(),password:fd.get('password')});if(error)throw error;await loadPortal()}catch(err){showError(authMessage(err))}finally{if(button.isConnected)button.disabled=false}});$('#forgotPassword')?.addEventListener('click',e=>sendPasswordReset(String($('#loginForm [name=email]').value||'').trim(),e.currentTarget));$('#requestForm')?.addEventListener('submit',e=>submitRequest(e,false));}
async function submitRequest(e,authenticated){e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type=submit]');button.disabled=true;try{const fd=new FormData(form),type=String(fd.get('applicant_type')),email=authenticated?(await db.auth.getUser()).data.user.email:String(fd.get('applicant_email')).trim().toLowerCase(),password=fd.get('password');if(!authenticated){const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:fd.get('applicant_name')}}});if(error)throw error;if(!data.user)throw Error('Account could not be created. Please try again.')}const applicantName=String(fd.get('applicant_name')||'').trim();const studentEmail=String(fd.get('student_email')||'').trim().toLowerCase()||(type==='student'?email:'');const parentEmail=String(fd.get('parent_email')||'').trim().toLowerCase()||(type==='parent'?email:'');const {error}=await db.from('student_applications').insert({applicant_name:applicantName,applicant_email:email,applicant_type:type,student_name:String(fd.get('student_name')).trim(),student_email:studentEmail,parent_name:String(fd.get('parent_name')||'').trim(),parent_email:parentEmail,phone:String(fd.get('phone')||'').trim(),message:String(fd.get('message')||'').trim(),status:'pending'});if(error)throw error;if(authenticated){await loadPortal()}else{app.innerHTML=`<section class="shell"><div class="panel"><h1>Request submitted</h1><div class="success">Your request is waiting for Admin approval. ${email.includes('@')?'If email confirmation is enabled, confirm your email before signing in.':''}</div><p class="muted">Once approved, sign in with the email and password you just created. Your student or parent portal records will then become available.</p><button class="button wide" id="backLogin">Go to sign in</button><a class="back" href="index.html">← Back to public website</a></div></section>`;$('#backLogin').onclick=()=>entry('login')}}catch(err){showError(requestErrorMessage(err))}finally{if(button.isConnected)button.disabled=false}}
async function portalData(user){const {data:students,error}=await db.from('academy_students').select('*').order('full_name');if(error)throw error;const {data:applications,error:appError}=await db.from('student_applications').select('*').ilike('applicant_email',user.email).order('submitted_at',{ascending:false});if(appError)throw appError;if(!students?.length)return {students:[],applications:applications||[]};const ids=students.map(s=>s.id);const [classes,attendance,progress,activities,updates,awards,ranks]=await Promise.all([db.from('academy_classes').select('*').eq('is_published',true).order('class_date'),db.from('academy_attendance').select('*').in('student_id',ids).order('recorded_at',{ascending:false}),db.from('academy_progress').select('*').in('student_id',ids).order('progress_date',{ascending:false}),db.from('academy_activities').select('*').in('student_id',ids).order('activity_date',{ascending:false}),db.from('academy_updates').select('*').order('update_date',{ascending:false}),db.from('academy_awards').select('*').in('student_id',ids).order('award_date',{ascending:false}),db.from('academy_rank_history').select('*').in('student_id',ids).order('promotion_date',{ascending:false})]);for(const result of [classes,attendance,progress,activities,updates,awards,ranks])if(result.error)throw result.error;return {students,applications:applications||[],classes:classes.data||[],attendance:attendance.data||[],progress:progress.data||[],activities:activities.data||[],updates:updates.data||[],awards:awards.data||[],ranks:ranks.data||[]}}
function list(items,empty,render){return items.length?items.map(render).join(''):`<div class="empty">${esc(empty)}</div>`}
async function hydrateStudentPhotos(root){const images=[...root.querySelectorAll('img[data-photo-path]')];await Promise.all(images.map(async img=>{const path=img.dataset.photoPath;if(!path)return;try{const {data,error}=await db.storage.from('academy-student-photos').createSignedUrl(path,3600);if(error||!data?.signedUrl)return;img.src=data.signedUrl;img.classList.remove('hidden');img.parentElement.querySelector('.photo-fallback')?.classList.add('hidden')}catch(_){}}))}
function dashboard(user,d){$('#signOut').classList.remove('hidden');if(!d.students.length){const latest=d.applications[0];const state=latest?.status||'none';app.innerHTML=`<section class="shell"><div class="panel"><h1>${state==='pending'?'Approval pending':state==='rejected'?'Request not approved':state==='approved'?'Access is paused':'Request portal access'}</h1><p class="muted">Signed in as ${esc(user.email)}.</p>${state==='pending'?`<div class="notice"><b>Your request is under review.</b><br>Training records will unlock after the Admin approves it.</div>`:state==='rejected'?`<div class="error">Your last request was not approved. Contact the academy if you think this was a mistake.</div>`:state==='approved'?`<div class="error">Your access is currently inactive. Please contact the academy Admin.</div>`:`<div class="notice">This account has no approved student profile yet. Submit a request below; Admin approval is required before records become visible.</div>`}${state==='none'||state==='rejected'?accessForm(true,user.email):''}<button class="button light wide" id="signOutInside">Sign out</button></div></section>`;$('#requestForm')?.addEventListener('submit',e=>submitRequest(e,true));$('#signOutInside').onclick=signOut;return}
const childIds=d.students.map(s=>s.id),byStudent=(rows,id)=>rows.filter(r=>r.student_id===id),row=(title,sub)=>`<div class="row"><b>${esc(title)}</b><small>${esc(sub)}</small></div>`;app.innerHTML=`<div class="dash-head"><h1>Welcome, ${esc(user.user_metadata?.full_name||user.email.split('@')[0])}</h1><p>Your student progress and academy updates.</p></div><div class="grid">${d.students.map(s=>{const attend=byStudent(d.attendance,s.id),present=attend.filter(a=>a.status==='present').length,percent=attend.length?Math.round(present/attend.length*100):0,prog=byStudent(d.progress,s.id),act=byStudent(d.activities,s.id),aw=byStudent(d.awards,s.id),rank=byStudent(d.ranks,s.id);const msgs=d.updates.filter(u=>u.is_published&&(!u.student_id||u.student_id===s.id));return `<section class="card profile"><div class="belt photo-frame"><span class="photo-fallback">🥋</span><img class="hidden" data-photo-path="${esc(s.photo_path||'')}" alt="${esc(s.full_name)} profile photo"></div><div><small>${d.students.length>1?'LINKED STUDENT':'STUDENT PROFILE'}</small><h2>${esc(s.full_name)}</h2><div>${esc(s.current_rank)}</div></div></section><section class="card"><div class="label">ATTENDANCE</div><div class="stat">${percent}%</div><div class="muted">${present} of ${attend.length} recorded classes attended</div></section><section class="card"><div class="label">LATEST PROGRESS SCORE</div><div class="stat">${prog[0]?.score==null?'—':esc(prog[0].score)+'%'}</div><div class="muted">${esc(prog[0]?.skill||'Coach progress notes will appear here')}</div></section><section class="card"><h2>Student progress</h2>${list(prog.slice(0,4),'No progress notes yet.',p=>row(p.skill+' · '+(p.score==null?'—':p.score+'%'),date(p.progress_date)+' · '+(p.note||p.next_goal||p.rank||'')))}</section><section class="card"><h2>Training activities</h2>${list(act.slice(0,4),'No activities recorded yet.',a=>row(a.title,date(a.activity_date)+' · '+(a.details||'')))}</section><section class="card"><h2>Class attendance</h2>${list(attend.slice(0,5),'No attendance records yet.',a=>row(a.status, date(a.recorded_at.slice(0,10))+' · '+a.note))}</section><section class="card"><h2>Upcoming classes</h2>${list(d.classes.slice(0,5),'No classes published yet.',c=>row(c.title,date(c.class_date)+' · '+String(c.start_time).slice(0,5)+' · '+c.location))}</section><section class="card"><h2>Awards & rank history</h2>${list([...aw.map(a=>({title:a.title,sub:date(a.award_date)+' · '+a.description})),...rank.map(r=>({title:r.rank,sub:date(r.promotion_date)+' · '+r.note}))].slice(0,6),'No awards or rank promotions yet.',x=>row(x.title,x.sub))}</section><section class="card full"><h2>Family updates</h2>${list(msgs.slice(0,5),'No academy updates yet.',u=>row(u.title,date(u.update_date)+' · '+u.message))}</section>`}).join('')}</div>`;hydrateStudentPhotos(app)}
async function loadPortal(){try{const {data:{user},error}=await db.auth.getUser();if(error||!user){$('#signOut').classList.add('hidden');entry('login');return}const {data:isAdmin,error:roleError}=await db.rpc('is_site_admin');if(roleError)throw roleError;if(isAdmin){await db.auth.signOut();$('#signOut').classList.add('hidden');entry('login');showError('Yeh Admin account hai. Student/Parent Portal mein apne alag email account se sign in karein.');return}$('#signOut').classList.remove('hidden');const d=await portalData(user);dashboard(user,d)}catch(e){entry('login');const panel=document.querySelector('.panel');if(panel){const notice=document.createElement('div');notice.className='error';notice.textContent=`Portal load nahi hua: ${e.message||'setup error'}. Email/profile match aur setup check karein.`;panel.prepend(notice)}}}
async function signOut(){if(db)await db.auth.signOut();$('#signOut').classList.add('hidden');entry('login')}
async function start(){db=window.createPrimeSupabaseClient?.('member');if(!db){entry('login');const n=document.createElement('div');n.className='error';n.textContent='Supabase settings are not set. Ask the Admin to complete the setup.';document.querySelector('.panel')?.prepend(n);return}$('#signOut').onclick=signOut;let recoveryMode=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;recoveryPage()}});if(recoveryMode){recoveryPage();return}const {data:{session}}=await db.auth.getSession();if(session)await loadPortal();else entry('login')}
start();
</script></body></html>
