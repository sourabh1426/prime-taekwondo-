<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
  <title>Admin Login | Prime Taekwondo</title><link rel="icon" type="image/png" href="logo.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 70% 15%,#273957,#0b1020 65%);font:15px/1.5 Arial,sans-serif;color:#172033}.card{width:min(440px,100%);background:#fff;border:1px solid #ffffff30;border-radius:18px;padding:30px;box-shadow:0 24px 70px #0005}.brand{text-align:center;margin-bottom:20px}.brand img{width:95px;height:75px;object-fit:contain}.brand strong{display:block;font-size:20px}.brand strong span{color:#df2636}.brand small{color:#687386;letter-spacing:.12em}.card h1{font-size:23px;margin:18px 0 5px}.hint{color:#687386;font-size:13px}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:800;font-size:12px}.field input{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:8px;font:inherit}.btn{width:100%;border:0;border-radius:8px;padding:12px;background:#ef3340;color:white;font-weight:900;font:inherit;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.text-btn{display:block;margin:12px auto 0;padding:5px 8px;border:0;background:none;color:#475569;text-decoration:underline;font:inherit;font-size:13px;cursor:pointer}.error{min-height:20px;color:#b4232f;font-size:13px;margin-top:12px}.success{min-height:20px;color:#176848;font-size:13px;margin-top:12px}.hidden{display:none!important}.back{display:block;text-align:center;margin-top:19px;color:#475569;font-size:13px}.demo-note{margin-top:17px;padding:12px;border-radius:8px;background:#f4f6f9;color:#596579;font-size:12px;line-height:1.55}
  </style>
</head>
<body>
  <main class="card"><div class="brand"><img src="logo.png" alt="Prime Taekwondo logo"><strong>PRIME <span>TAEKWONDO</span></strong><small>ADMIN PORTAL</small></div>
    <h1 id="pageTitle">Admin sign in</h1><p class="hint" id="pageHint">Sign in using the Admin account created in Supabase.</p>
    <form id="loginForm"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submitButton" type="submit">Sign in</button><button class="text-btn" id="forgotPassword" type="button">Forgot password?</button><div class="error" id="error" role="alert"></div></form>
    <form id="recoveryForm" class="hidden"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" id="savePassword" type="submit">Save new password</button><div class="error" id="recoveryMessage" role="alert"></div></form>
    <div class="demo-note" id="demoNote">Admin login works after the one-time Supabase setup in the included guide. This website does not keep passwords in the page.</div><a class="back" href="index.html">← Back to public website</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
  <script>
    const form=document.getElementById('loginForm'),errorBox=document.getElementById('error'),button=document.getElementById('submitButton'),client=window.createPrimeSupabaseClient?.();
    function showError(message){errorBox.className='error';errorBox.textContent=message}
    function showRecovery(){const recoveryForm=document.getElementById('recoveryForm');if(!recoveryForm.classList.contains('hidden'))return;document.getElementById('pageTitle').textContent='Set a new password';document.getElementById('pageHint').textContent='Choose a new password for your Admin account.';form.classList.add('hidden');recoveryForm.classList.remove('hidden');document.getElementById('demoNote').classList.add('hidden')}
    document.getElementById('forgotPassword').addEventListener('click',async event=>{showError('');const email=document.getElementById('email').value.trim();if(!email){showError('Pehle Admin email likhein, phir Forgot password par click karein.');document.getElementById('email').focus();return}const resetButton=event.currentTarget;resetButton.disabled=true;try{if(!client)throw new Error('Supabase settings are not set. Follow the setup guide.');const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;errorBox.className='success';errorBox.textContent='Agar is email par account hai, reset link inbox mein bhej diya gaya hai. Spam folder bhi check karein.'}catch(err){showError(err.message||'Reset email nahi bheja ja saka.')}finally{resetButton.disabled=false}});
    document.getElementById('recoveryForm').addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('recoveryMessage'),save=document.getElementById('savePassword'),password=document.getElementById('newPassword').value;if(password!==document.getElementById('confirmPassword').value){message.textContent='Dono passwords match nahi karte.';return}if(!client){message.textContent='Supabase settings are not set. Follow the setup guide.';return}message.textContent='';save.disabled=true;try{const {error}=await client.auth.updateUser({password});if(error)throw error;await client.auth.signOut();history.replaceState(null,'',location.pathname+location.search);document.getElementById('recoveryForm').classList.add('hidden');document.getElementById('pageTitle').textContent='Password updated';document.getElementById('pageHint').textContent='Aapka password change ho gaya. Ab naye password se Admin sign in karein.';document.getElementById('pageHint').className='success';document.getElementById('demoNote').classList.add('hidden')}catch(err){message.textContent=err.message||'Password update nahi ho saka. Reset link expire ho sakta hai; naya link mangayein.'}finally{save.disabled=false}});
    if(client){client.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')showRecovery()});if(new URLSearchParams(location.hash.slice(1)).get('type')==='recovery')showRecovery()}
    form.addEventListener('submit',async event=>{
      event.preventDefault();showError('');button.disabled=true;button.textContent='Signing in…';
      if(!client){showError('The Admin login is not configured yet. Follow the included setup guide.');button.disabled=false;button.textContent='Sign in';return}
      try{const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data,error:roleError}=await client.rpc('is_site_admin');if(roleError||data!==true){await client.auth.signOut();throw new Error('Login credentials were accepted, but this account is not approved as a Prime Taekwondo Admin.')}location.href='admin-dashboard.html'}catch(err){const msg=String(err.message||'');showError(msg==='Invalid login credentials'?'Email ya password match nahi hua. “Forgot password?” se password reset karein.':msg.toLowerCase().includes('email not confirmed')?'Pehle Supabase confirmation email se apna email confirm karein.':msg||'Could not sign in. Please try again.');button.disabled=false;button.textContent='Sign in'}
    });
  </script>
</body>
</html>
