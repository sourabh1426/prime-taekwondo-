<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Prime Taekwondo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
}

.login-box {
    width: 400px;
    max-width: 92%;
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    font-size: 28px;
    color: #111827;
}

.logo span {
    color: #ef4444;
}

.logo p {
    margin-top: 8px;
    color: #6b7280;
}

label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #ef4444;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #ef4444;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #dc2626;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 10px;
    border-radius: 6px;
    background: #fee2e2;
    color: #b91c1c;
    text-align: center;
}

.back {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #6b7280;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>PRIME <span>TAEKWONDO</span></h1>
        <p>Admin Portal</p>
    </div>

    <form id="loginForm">

        <label for="email">Admin Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login to Admin Panel
        </button>

        <div class="error" id="error">
            Invalid admin email or password.
        </div>

    </form>

    <a href="index.html" class="back">
        ← Back to Prime Taekwondo
    </a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    /*
       DEMO LOGIN ONLY

       These credentials are intentionally for testing.
       Do NOT use this authentication method for production.
    */

    const adminEmail = "admin@primetaekwondo.com";
    const adminPassword = "Admin@123";

    if (email === adminEmail && password === adminPassword) {

        sessionStorage.setItem("primeAdminLoggedIn", "true");

        window.location.href = "admin-dashboard.html";

    } else {

        document.getElementById("error").style.display = "block";

    }

});

</script>

</body>
</html>
