<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020"><meta name="description" content="Photos of training, events and achievements at Prime Taekwondo.">
  <title>Gallery | Prime Taekwondo</title><link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{--night:#0b1020;--navy:#111827;--red:#ef3340;--gold:#f4ca73;--ink:#111827;--muted:#687386;--line:#e4e8ef}
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}
    header{background:var(--night);color:#fff}.nav{width:min(1120px,92%);min-height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:900}.brand img{width:58px;height:48px;object-fit:contain;mix-blend-mode:screen}.brand span span{color:#ff5964}.nav a:last-child{background:var(--red);padding:10px 15px;border-radius:8px;text-decoration:none;font-weight:800}
    main{width:min(1120px,92%);margin:auto;padding:56px 0 76px}.intro{text-align:center;margin:0 auto 30px;max-width:700px}.kicker{color:#bb2330;font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:900}.intro h1{font-size:clamp(34px,5vw,52px);line-height:1.1;letter-spacing:-.04em;margin:8px 0}.intro p{color:var(--muted);margin:0}
    .filters{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:25px 0 30px}.filters button{border:1px solid var(--line);background:white;color:#374151;padding:9px 15px;border-radius:999px;font-weight:800;cursor:pointer}.filters button.active,.filters button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.item{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 9px 26px #1018270b}.item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8edf3;display:block}.copy{padding:15px 17px}.copy strong{display:block;font-size:15px}.copy p{font-size:13px;color:var(--muted);margin:5px 0 0;white-space:pre-wrap}.empty,.status{padding:25px;border:1px dashed #cbd3df;border-radius:13px;background:white;text-align:center;color:var(--muted)}.status[hidden],.empty[hidden],.grid[hidden]{display:none}
    footer{background:var(--night);color:#bdc6d3;padding:25px;text-align:center;font-size:13px}footer a{color:#fff}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.nav{min-height:66px}.brand img{width:46px}.grid{grid-template-columns:1fr}main{padding-top:40px}}
  </style>
</head>
<body>
  <header><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html"><img src="logo.png" alt=""><span>PRIME <span>TAEKWONDO</span></span></a><a href="index.html">Home</a></nav></header>
  <main>
    <section class="intro"><div class="kicker">Life at the academy</div><h1>Training Gallery</h1><p>Training, events and achievements from Prime Taekwondo.</p></section>
    <div id="status" class="status" role="status">Loading gallery…</div>
    <div id="filters" class="filters" aria-label="Filter gallery" hidden></div>
    <div id="grid" class="grid" hidden></div>
    <div id="empty" class="empty" hidden>Gallery photos will be added soon.</div>
  </main>
  <footer><a href="index.html">Prime Taekwondo</a> · Train hard · Stay disciplined · Become strong</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
  <script>
    const statusBox=document.getElementById('status'),grid=document.getElementById('grid'),empty=document.getElementById('empty'),filters=document.getElementById('filters');
    const categories=['All','Training','Events','Awards','Classes'];let allPhotos=[];
    function showCategory(category){
      const photos=category==='All'?allPhotos:allPhotos.filter(p=>p.category===category);grid.replaceChildren();
      for(const photo of photos){const {data}=client.storage.from('academy-gallery').getPublicUrl(photo.image_path);const article=document.createElement('article');article.className='item';const img=document.createElement('img');img.src=data.publicUrl;img.alt=photo.title||'Prime Taekwondo gallery photo';img.loading='lazy';const copy=document.createElement('div');copy.className='copy';const title=document.createElement('strong');title.textContent=photo.title||'Prime Taekwondo';copy.append(title);if(photo.caption){const caption=document.createElement('p');caption.textContent=photo.caption;copy.append(caption)}article.append(img,copy);grid.append(article)}
      grid.hidden=photos.length===0;empty.hidden=photos.length!==0;empty.textContent=allPhotos.length?'No photos in this category yet.':'Gallery photos will be added soon.';
    }
    let client;
    async function loadGallery(){
      client=window.createPrimeSupabaseClient?.();
      if(!client){statusBox.textContent='The gallery is being set up. Please visit again soon.';return}
      try{const {data,error}=await client.from('gallery_photos').select('title,caption,category,image_path').eq('is_published',true).order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error)throw error;allPhotos=data||[];statusBox.hidden=true;if(!allPhotos.length){empty.hidden=false;return}filters.hidden=false;for(const category of categories){const button=document.createElement('button');button.type='button';button.textContent=category;button.classList.toggle('active',category==='All');button.addEventListener('click',()=>{filters.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');showCategory(category)});filters.append(button)}showCategory('All')}catch(error){console.error(error);statusBox.textContent='Gallery could not load right now. Please refresh the page.'}
    }
    loadGallery();
  </script>
</body>
</html>
